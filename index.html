<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora – Grupo Skynet</title>
<style>
:root{--bg1:#f1fcf4;--bg2:#d3f4dc;--hero1:#c2efcf;--hero2:#e3f8e9;--card:#fff;--tx:#2b4a36;--mut:#5f7a6a;--bd:#cfe9d6;--in:#b4dcc0;color-scheme:light;--pri:#2e9e4d;--pri2:#238a42;--on:#fff;--dan:#c0392b;--row:#f4fbf6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed}
.hero{background:#fff;border-bottom:6px solid var(--pri);box-shadow:0 5px 0 #8fd400;text-align:center;padding:22px 16px 18px}
.hero img{height:140px;max-width:92%}
.hero p{margin:12px 0 0;letter-spacing:3px;font-size:.9rem;font-weight:600;color:#2e9e4d}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--card)),var(--card));border:1px solid var(--bd);border-top:7px solid var(--c);border-radius:20px;padding:18px 12px;text-align:center}
.stat span{display:block;font-weight:600;font-size:.95rem}
.stat b{display:block;font-size:2.4rem;color:var(--c);margin-top:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-bottom:22px;box-shadow:0 6px 20px rgba(31,122,69,.07)}
h2{margin:0 0 16px;font-size:1.6rem;color:var(--pri)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.g{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-weight:700;font-size:.9rem;color:var(--pri2);margin-bottom:6px}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--in);border-radius:14px;background:var(--card);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:transparent}
textarea{min-height:90px;resize:vertical}
.btn{margin-top:18px;border:0;border-radius:14px;padding:14px 26px;background:linear-gradient(90deg,var(--pri2),var(--pri));color:var(--on);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:hover{background:var(--pri2);color:var(--on)}
#msg{margin-left:14px;color:var(--pri);font-weight:600}
.zonas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.z{background:var(--row);border:1px solid var(--bd);border-left:6px solid #8fd400;border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;font-weight:600}
.z b{color:var(--pri)}
.bar{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar .f{min-width:200px}
.rec{display:flex;justify-content:space-between;gap:12px;background:var(--row);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:10px}
.rec .t{font-weight:700}
.tag{display:inline-block;font-size:.78rem;font-weight:600;border-radius:20px;padding:2px 10px;background:var(--pri);color:var(--on);margin-right:6px}
.mut{color:var(--mut);font-size:.92rem;margin-top:4px}
.del{border:0;background:none;color:var(--dan);font:inherit;cursor:pointer;align-self:flex-start}
.total{font-weight:700;color:var(--pri2)}
#toast{display:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);gap:14px;align-items:center;background:#2e9e4d;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:20}
#toast button{background:#8fd400;color:#10261a;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>

function load(){
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{mem=JSON.parse(raw)}catch(e){mem=[]}mem.forEach(function(r,i){if(r.id==null)r.id=Date.now()+i})}
  else{mem=[{id:1,fecha:"2026-10-15",tipo:"Mantenimiento",zona:"Fortaleza",cliente:"Flor Alegría",detalle:"Cambio de contraseña. Señora de la tercera edad."}];save()}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}}
function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(f){var p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var f=$("v-fecha").value||hoy();
  var dia=mem.filter(function(r){return r.fecha===f});
  var n=function(k,v){return dia.filter(function(r){return r[k]===v}).length};
  $("titulo").textContent="Bitácora del "+fmt(f);
  $("stats").innerHTML=TIPOS.map(function(t){return'<div class="stat" style="--c:'+t[2]+'"><span>'+t[1]+'</span><b>'+n("tipo",t[0])+'</b></div>'}).join("");
  $("zonas").innerHTML=ZONAS.map(function(z){return'<div class="z"><span>'+z+'</span><b>'+n("zona",z)+'</b></div>'}).join("");
  $("total").textContent="Total de atenciones: "+dia.length;
  $("lista").innerHTML=dia.length?dia.map(function(r){
    return'<div class="rec"><div><div class="t">'+esc(r.cliente)+'</div><div style="margin-top:4px"><span class="tag" style="background:'+col(r.tipo)+';color:#fff">'+esc(r.tipo)+'</span><span class="tag">'+esc(r.zona)+'</span></div>'+(r.detalle?'<div class="mut">'+esc(r.detalle)+'</div>':'')+'</div><button class="del" data-id="'+r.id+'">Eliminar</button></div>'}).join(""):'<div class="mut" style="margin-top:10px">Sin registros este día.</div>';
}
$("f-zona").innerHTML=ZONAS.map(function(z){return"<option>"+z+"</option>"}).join("");
$("guardar").onclick=function(){
  var cli=$("f-cli").value.trim();
  if(!cli){$("msg").textContent="Escribe el nombre del cliente.";$("f-cli").focus();return}
  var fecha=$("f-fecha").value||hoy();
  mem.push({id:Date.now(),fecha:fecha,tipo:$("f-tipo").value,zona:$("f-zona").value,cliente:cli,detalle:$("f-det").value.trim()});
  save();$("f-cli").value="";$("f-det").value="";$("v-fecha").value=fecha;
  $("msg").textContent="Registro guardado ✓";setTimeout(function(){$("msg").textContent=""},2500);render();
};
var undo=null,tt=null;
$("lista").onclick=function(e){
  var b=e.target.closest("button[data-id]");if(!b)return;
  var id=b.dataset.id;
  var i=mem.findIndex(function(r){return String(r.id)===id});
  if(i<0)return;
  undo={r:mem[i],i:i};mem.splice(i,1);save();render();
  $("toast").style.display="flex";clearTimeout(tt);
  tt=setTimeout(function(){$("toast").style.display="none";undo=null},7000);
};
$("deshacer").onclick=function(){
  if(!undo)return;mem.splice(undo.i,0,undo.r);save();undo=null;
  $("toast").style.display="none";render();
};
$("v-fecha").onchange=render;
load();$("f-fecha").value=hoy();$("v-fecha").value=hoy();render();
</script>
</body>
</html>
